[package]
name = "geph5-prototest"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
async-event = "0.2.1"
async-trait = "0.1.92"
geph5-rt = { path = "../../libraries/geph5-rt" }
tokio = { version = "1.53", features = ["io-util", "time"] }
tokio-native-tls = "0.3.1"
atomic_float = "1.1.0"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-queue = "0.3.13"
dashmap = "6.2.1"
fastrand = "2.5.0"
futures-concurrency = "7.7.1"
futures-util = "0.3.34"
hex = "0.4.3"
native-tls = "0.2.18"
once_cell = "1.21.4"
oneshot = "0.1.13"
picomux = { path = "../../libraries/picomux" }
rand = "0.8.8"
rcgen = "0.13.2"
scopeguard = "1.2.0"
serde = "1.0.229"
serde_json = "1.0.151"
sillad = { path = "../../libraries/sillad" }
sillad-conntest = { path = "../../libraries/sillad-conntest" }
sillad-native-tls = { path = "../../libraries/sillad-native-tls" }
sillad-sosistab3 = { path = "../../libraries/sillad-sosistab3" }
sillad-meeklike = { path = "../../libraries/sillad-meeklike" }
sillad-hex = { path = "../../libraries/sillad-hex" }
tachyonix = "0.3.1"
tap = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x25519-dalek = {version="2", default-features=false, features=["serde"]}
geph5-misc-rpc = { path = "../../libraries/geph5-misc-rpc" }
time = "0.3.55"
