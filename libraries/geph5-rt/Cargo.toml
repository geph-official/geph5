[package]
name = "geph5-rt"
version = "0.3.7"
edition = "2024"
description = "tokio-based runtime helpers for geph5: cancel-on-drop tasks, immortal/respawn loops, a task reaper, a timeout combinator, and buffer-pooled reads"
repository.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "io-util", "net", "sync"] }
futures-util = "0.3.34"
futures-concurrency = "7.7.1"
async-channel = "2.5.0"
bytes = "1.12.1"
pin-project-lite = "0.2.17"
rand = "0.8.8"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "io-util", "net", "sync"] }
