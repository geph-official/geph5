[package]
name = "sillad-sosistab3"
edition = "2024"
description = "A scramblesuit-like obfuscation protocol within the sillad framework"
version = "0.3.3"
repository.workspace = true
license.workspace = true

[dependencies]
arrayref = "0.3.9"
blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
rand = "0.9.5"
# x25519-dalek 2 uses rand_core 0.6.
rand_core = { version = "0.6.4", features = ["getrandom"] }
x25519-dalek = {version="2", default-features=false, features=["serde"]}
sillad = { version = "0.3.3", path = "../sillad" }
geph5-rt = { version = "0.3.8", path = "../geph5-rt" }
tokio = { version = "1.53", features = ["io-util", "time"] }
pin-project = "1.1.13"
smallvec = "1.15.2"
async-trait = "0.1.92"
tap = "1.0.1"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
hex = "0.4.3"
anyhow = "1.0.104"
tachyonix = "0.3.1"
once_cell = "1.21.4"
serde_json = "1.0.151"
futures-concurrency = "7.7.1"

[dev-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
