[package]
name = "nanorpc-sillad"
version = "0.2.1"
edition = "2024"
description = "nanorpc transport over sillad pipes"
repository.workspace = true
license.workspace = true

[dependencies]
sillad = { version = "0.3.2", path = "../sillad" }
geph5-rt = { version = "0.3.7", path = "../geph5-rt" }
async-trait = "0.1.92"
nanorpc = "0.1.13"
serde_json = "1.0.151"
thiserror = "1.0.69"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["io-util"] }
