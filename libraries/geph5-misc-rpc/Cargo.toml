[package]
name = "geph5-misc-rpc"
edition = "2024"
description = "Geph5 misc RPC protocols"
version.workspace = true
repository.workspace = true
license.workspace = true


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
stdcode = "0.1.14"
async-trait = "0.1.92"
nanorpc = "0.1.13"
serde_json = "1.0.151"
thiserror = "1.0.69"
anyhow = "1.0.104"
bytes = { version = "1.12.1", features = ["serde"] }
ed25519-dalek = {version="2", default-features=false, features=["serde"]}
x25519-dalek = {version="2", default-features=false, features=["serde"]}
blake3 = { version = "1.8.7", features = ["serde"] }
sillad = { version="0.3.2", path = "../sillad" }
nanorpc-sillad = { version = "0.2.1", path = "../nanorpc-sillad" }
geph5-rt = { version = "0.3.7", path = "../geph5-rt" }
tokio = { version = "1.53", features = ["io-util"] }
chacha20poly1305 = "0.10.1"
smallvec = "1.15.2"
tap = "1.0.1"
pin-project = "1.1.13"
socksv5 = "0.3"
tachyonix = "0.3.1"
geph5-broker-protocol = { version="0.4.0", path = "../geph5-broker-protocol" }
sillad-meeklike = {version="0.2.1", path="../sillad-meeklike"}
